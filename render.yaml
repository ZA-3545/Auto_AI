# Render Blueprint — AutoAI API (backend only).
# Frontend deploys separately on Vercel. Secrets go in the Render dashboard,
# not in this file. See docs/DEPLOYMENT.md.

services:
  - type: web
    name: autoai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AI_PROVIDER
        value: openrouter
      # Set in dashboard (do not commit real values):
      # DATABASE_URL, CORS_ORIGINS, OPENROUTER_API_KEY or OPENAI_API_KEY,
      # OPENROUTER_MODEL / OPENAI_MODEL, EMBEDDING_MODEL, etc.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
